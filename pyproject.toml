[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "token-saver"
version = "0.1.0"
description = "MCP server that saves 70-95% tokens for AI coding assistants without losing functionality"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Omer"},
]
keywords = ["mcp", "llm", "token", "optimization", "ai", "coding-assistant", "tree-sitter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastmcp>=2.0",
    "tree-sitter>=0.21,<0.22",
    "tree-sitter-languages>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]
counting = [
    "tiktoken>=0.7",
]

[project.scripts]
token-saver = "token_saver.__main__:main"

[project.urls]
Homepage = "https://github.com/omere/Token-Saver"
Repository = "https://github.com/omere/Token-Saver"
Issues = "https://github.com/omere/Token-Saver/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/token_saver"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
