[package]
name = "tokenjar-desktop"
version = "1.0.1"
edition = "2021"
authors = ["Ömer Faruk Eskitürk"]
license = "BUSL-1.1"
description = "Native Tauri v2 desktop application for TokenJar"
build = "build.rs"

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenjar-core = { path = "../tokenjar-core" }

[build-dependencies]
tauri-build = { version = "2.0" }
