[package]
name = "token-saver"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Zero-cost, zero-latency token optimization engine and intelligent MCP middleware"
documentation = "https://docs.rs/token-saver"
readme = "../../README.md"

[[bin]]
name = "token-saver"
path = "src/main.rs"

[dependencies]
token-saver-core = { version = "1.0.0", path = "../token-saver-core" }
clap = { version = "4.5", features = ["derive", "cargo"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
ureq = { version = "2.10", features = ["json"] }
